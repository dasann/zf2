name: Coding standards

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install isolated quality tools
        run: npm ci --prefix .quality --ignore-scripts --no-audit --no-fund
      - name: Determine changed scope
        id: scope
        run: |
          if [ -n "$BASE_SHA" ]; then
            node .quality/check.mjs --prepare
          else
            node .quality/check.mjs --all --prepare
          fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: phpcs:4.0.4
          coverage: none
      - name: Check instructions, format and language rules
        run: |
          if [ -n "$BASE_SHA" ]; then
            node .quality/check.mjs
          else
            node .quality/check.mjs --all
          fi
